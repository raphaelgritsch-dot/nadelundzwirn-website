<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Visitenkarte Rückseite (2026) | Nadel &amp; Zwirn</title>
<link href="../fonts/fonts.css" rel="stylesheet">
<style>
  /* 85 x 55 mm Endformat + 2 mm Beschnitt rundum = 89 x 59 mm */
  @page{ size: 89mm 59mm; margin: 0; }
  *{ box-sizing: border-box; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  html, body{ margin: 0; padding: 0; }
  body{ width: 89mm; height: 59mm; }
  :root{
    --bg-0: #0a0a0a; --fg: #f3f2ee; --fg-dim: #a7a6a1; --red: #c9282c;
    --font-display: 'Archivo Black', 'Inter', Arial, sans-serif;
    --font-body: 'Inter', Arial, sans-serif;
  }
  .page{ position: relative; width: 89mm; height: 59mm; overflow: hidden; background: var(--bg-0); font-family: var(--font-body); color: var(--fg); }
  .trim{ position: absolute; left: 2mm; top: 2mm; width: 85mm; height: 55mm; }

  .wm{ position: absolute; left: 6mm; bottom: 6.5mm; margin: 0; font-family: var(--font-display); text-transform: uppercase; font-size: 3.1mm; line-height: 1.2; letter-spacing: 0.01em; color: var(--fg); }
  .wmline{ position: absolute; left: 6mm; bottom: 15mm; width: 9mm; border-top: 0.5mm solid var(--red); }
  .qr{ position: absolute; left: 6mm; top: 50%; transform: translateY(-50%); width: 20mm; height: 20mm; background: #fff; padding: 1.3mm; }
  .vline{ position: absolute; left: 29mm; top: 7.5mm; bottom: 7.5mm; width: 0; border-left: 0.5mm solid var(--red); }
  .qr img{ width: 100%; height: 100%; display: block; }
  .frame{ position: absolute; left: 3.5mm; top: 3.5mm; right: 3.5mm; bottom: 3.5mm; border: 0.35mm solid var(--red); pointer-events: none; }
  .info{ position: absolute; right: 0; top: 0; bottom: 0; width: 52mm; padding: 0 0 0 0; }
  .name{
    position: absolute; right: 12.5mm; top: 7.5mm; margin: 0; text-align: right;
    font-family: var(--font-display); font-weight: 400; text-transform: uppercase;
    font-size: 3.6mm; line-height: 1.05; letter-spacing: 0.01em; color: var(--fg);
  }
  .role{
    position: absolute; right: 12.5mm; top: 12.6mm; margin: 0; text-align: right;
    font-weight: 700; font-size: 1.9mm; letter-spacing: 0.2em; text-transform: uppercase; color: var(--red);
  }
  .rows{ position: absolute; right: 0; left: 0; top: 21mm; }
  .row{ position: relative; height: 5.6mm; margin-bottom: 1.5mm; }
  .row .v{
    position: absolute; right: 12.5mm; top: 0; height: 5.6mm; display: flex; align-items: center;
    font-size: 2.3mm; letter-spacing: 0.02em; color: var(--fg);
  }
  /* weiße Icon-Tabs laufen bis in den Beschnitt */
  .row .tab{
    position: absolute; right: 3.5mm; top: 0; width: 8.5mm; height: 5.6mm;
    background: var(--fg); color: var(--bg-0);
    display: flex; align-items: center; padding-left: 1.7mm;
  }
  .row .tab svg{ width: 2.7mm; height: 2.7mm; }
</style>
</head>
<body>
  <div class="page">
    <div class="trim">
      <div class="frame"></div>
      <div class="vline"></div>
      <div class="qr"><img src="qr-nadelundzwirn.svg" alt="QR-Code zu nadelundzwirn.at"></div>
      <div class="stitch"></div>
      <div class="info">
        <p class="name">Raphael Gritsch</p>
        <p class="role">Gründer</p>
        <div class="rows">
          <div class="row"><span class="v">+43 677 61817640</span><span class="tab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6 19.8 19.8 0 0 1-3.1-8.7A2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 2 .7 3a2 2 0 0 1-.5 2.1L8 10.1a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.5c1 .3 2 .5 3 .7a2 2 0 0 1 1.6 2z"/></svg></span></div>
          <div class="row"><span class="v">office@nadelundzwirn.at</span><span class="tab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M2 6l10 7 10-7"/></svg></span></div>
          <div class="row"><span class="v">www.nadelundzwirn.at</span><span class="tab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15.3 15.3 0 0 1 0 20M12 2a15.3 15.3 0 0 0 0 20"/></svg></span></div>
          <div class="row"><span class="v">Klagenfurt, Kärnten</span><span class="tab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s7-6.2 7-12a7 7 0 0 0-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/></svg></span></div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
