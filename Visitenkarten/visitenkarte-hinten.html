<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Visitenkarte Rückseite — Nadel & Zwirn</title>
<link href="fonts/fonts.css" rel="stylesheet">
<style>
  @page{ size: 85mm 55mm; margin: 0; }
  *{ box-sizing: border-box; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  html, body{ margin: 0; padding: 0; background: #ccc; }
  body{ display: flex; align-items: center; justify-content: center; min-height: 100vh; }

  :root{
    --cream: #e9e0d2;
    --red: #c9282c;
    --red-dark: #8f1c1f;
    --font-display: 'Archivo Black', 'Inter', Arial, sans-serif;
    --font-body: 'Inter', Arial, sans-serif;
  }

  .card{
    width: 85mm;
    height: 55mm;
    position: relative;
    overflow: hidden;
    background: var(--cream);
    box-shadow: 0 4px 24px rgba(0,0,0,0.25);
  }

  /* Großes rotes Feld, diagonal geschnitten, lässt oben links eine
     Creme-Ecke frei (wie im Referenzbild) */
  .red-field{
    position: absolute;
    inset: 0;
    background: var(--red);
    clip-path: polygon(0 34%, 46% 0, 100% 0, 100% 100%, 0 100%);
  }

  /* Diagonale Streifen-Deko in der Creme-Ecke oben links */
  .stripes{
    position: absolute;
    left: 4mm; top: 4mm;
    width: 26mm; height: 16mm;
  }
  .stripes span{
    position: absolute;
    left: 0; top: 0;
    width: 30mm;
    height: 0.9mm;
    background: var(--red);
    transform-origin: left center;
    transform: rotate(-34deg);
  }
  .stripes span:nth-child(1){ top: 0mm; }
  .stripes span:nth-child(2){ top: 2.3mm; }
  .stripes span:nth-child(3){ top: 4.6mm; }

  /* QR-Feld oben rechts */
  .qr-box{
    position: absolute;
    right: 5mm; top: 5mm;
    width: 17mm; height: 17mm;
    background: #fff;
    padding: 1.4mm;
  }
  .qr-box img{ width: 100%; height: 100%; display: block; }

  /* Markenname unten links */
  .brand{
    position: absolute;
    left: 6mm; bottom: 6.5mm;
    color: var(--cream);
  }
  .brand .word{
    font-family: var(--font-display);
    font-weight: 400;
    font-size: 6.6mm;
    line-height: 1;
    margin: 0 0 1.6mm;
  }
  .brand .tagline{
    font-family: var(--font-body);
    font-weight: 600;
    font-size: 2.3mm;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: rgba(233,224,210,0.75);
    margin: 0;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="red-field"></div>
    <div class="stripes">
      <span></span><span></span><span></span>
    </div>
    <div class="qr-box">
      <img src="qr-nadelundzwirn.svg" alt="QR-Code zu nadelundzwirn.at">
    </div>
    <div class="brand">
      <p class="word">Nadel &amp; Zwirn</p>
      <p class="tagline">Ihr Stickbetrieb</p>
    </div>
  </div>
</body>
</html>
