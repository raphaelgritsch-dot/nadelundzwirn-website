<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Visitenkarte Vorderseite — Nadel & Zwirn</title>
<link href="../fonts/fonts.css" rel="stylesheet">
<style>
  @page{ size: 85mm 55mm; margin: 0; }
  *{ box-sizing: border-box; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  html, body{ margin: 0; padding: 0; background: #444; }
  body{ display: flex; align-items: center; justify-content: center; min-height: 100vh; }

  :root{
    --bg-0: #0a0a0a;
    --fg: #f3f2ee;
    --fg-dim: #a7a6a1;
    --line: #2b2b2b;
    --red: #c9282c;
    --font-display: 'Archivo Black', 'Inter', Arial, sans-serif;
    --font-body: 'Inter', Arial, sans-serif;
  }

  .card{
    width: 85mm;
    height: 55mm;
    position: relative;
    overflow: hidden;
    background: var(--bg-0);
    font-family: var(--font-body);
    box-shadow: 0 4px 24px rgba(0,0,0,0.4);
  }

  .photo{
    position: absolute;
    left: 0; top: 0;
    width: 31mm;
    height: 55mm;
    overflow: hidden;
  }
  .photo img{
    width: 100%; height: 100%;
    object-fit: cover;
    object-position: 60% 45%;
    filter: saturate(0.9) contrast(1.02);
  }
  .photo::after{
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg, transparent 60%, var(--bg-0) 100%);
  }

  .content{
    position: absolute;
    left: 31mm; top: 0;
    right: 0; bottom: 0;
    padding: 6mm 5mm 6mm 6mm;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  .name{
    font-family: var(--font-display);
    font-weight: 400;
    text-transform: uppercase;
    font-size: 4.6mm;
    line-height: 1.12;
    color: var(--fg);
    margin: 0 0 1.4mm;
  }
  .role{
    font-family: var(--font-body);
    font-weight: 700;
    font-size: 2.3mm;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--red);
    margin: 0;
  }

  .divider{
    border: none;
    border-top: 0.25mm solid var(--line);
    margin: 4mm 0;
  }

  .contact{ display: flex; flex-direction: column; gap: 2.1mm; }
  .contact-row{
    display: flex;
    align-items: center;
    gap: 2.2mm;
    font-size: 2.5mm;
    color: var(--fg-dim);
  }
  .contact-row svg{
    width: 2.9mm; height: 2.9mm;
    flex: none;
    color: var(--red);
  }

  .edge-bar{
    position: absolute;
    right: 0; top: 0; bottom: 0;
    width: 1.4mm;
    background: var(--red);
  }
</style>
</head>
<body>
  <div class="card">
    <div class="photo">
      <img src="../brother-vr.jpg" alt="Stickmaschine bei der Arbeit">
    </div>
    <div class="content">
      <p class="name">Raphael<br>Gritsch</p>
      <p class="role">Inhaber</p>
      <hr class="divider">
      <div class="contact">
        <div class="contact-row">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6 19.8 19.8 0 0 1-3.1-8.7A2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 2 .7 3a2 2 0 0 1-.5 2.1L8 10.1a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.5c1 .3 2 .5 3 .7a2 2 0 0 1 1.6 2z"/></svg>
          <span>+43 677 61817640</span>
        </div>
        <div class="contact-row">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M2 6l10 7 10-7"/></svg>
          <span>office@nadelundzwirn.at</span>
        </div>
        <div class="contact-row">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15.3 15.3 0 0 1 0 20M12 2a15.3 15.3 0 0 0 0 20"/></svg>
          <span>www.nadelundzwirn.at</span>
        </div>
      </div>
    </div>
    <div class="edge-bar"></div>
  </div>
</body>
</html>
