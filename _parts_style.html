<style>
  /* ============================================================
     NADEL & ZWIRN — Marketing-Website
     NEUES DESIGNSYSTEM (kompletter Neubau, kein Karten-/Boxen-Stil
     mehr): monochromes Editorial-Layout in Schwarz/Anthrazit/Weiß,
     orientiert an großformatigen Foto-Grids ohne Abstände, riesiger
     Lauftext-Typografie als Sektionstrenner und flachen Zeilen-
     Layouts statt Boxen. Rot ist nur noch ein minimaler Akzent.
     Dieser <style>-Block ist bewusst identisch mit dem aus
     index.html, damit beide Seiten optisch ein System bilden.
     ============================================================ */

  :root{
    /* Monochrome Basis: mehrere Dunkeltöne für Layering */
    --bg-0: #0a0a0a;
    --bg-1: #121212;
    --bg-2: #1a1a1a;
    --bg-3: #242424;

    /* Text: Creme-Weiß auf Schwarz, Grautöne für sekundären Text */
    --fg:      #f3f2ee;
    --fg-dim:  #a7a6a1;
    --fg-faint:#6c6c67;

    /* Trennlinien: gedeckte Grautöne, keine Farbflächen */
    --line:      #2b2b2b;
    --line-soft: #202020;

    /* Rot: ausschließlich minimaler Akzent (Links, CTA-Rahmen, Marquee-Trenner, Nummerierung) */
    --red:      #c9282c;
    --red-dim:  rgba(201,40,44,0.55);

    --font-script:  'Yellowtail', cursive;
    --font-display: 'Archivo Black', 'Inter', Arial, sans-serif;
    --font-body:    'Inter', Arial, sans-serif;

    --container: 1360px;
    --header-h: 84px;
    --transition: 240ms ease;
  }

  *, *::before, *::after{ box-sizing: border-box; }
  html{ scroll-behavior: smooth; }
  @media (prefers-reduced-motion: reduce){
    html{ scroll-behavior: auto; }
    *, *::before, *::after{ animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; scroll-behavior: auto !important; }
  }

  body{
    margin: 0;
    background-color: var(--bg-0);
    color: var(--fg);
    font-family: var(--font-body);
    font-size: 17px;
    line-height: 1.65;
    -webkit-font-smoothing: antialiased;
  }

  h1, h2, h3, h4{
    font-family: var(--font-display);
    font-weight: 400;
    text-transform: uppercase;
    letter-spacing: 0.005em;
    line-height: 0.98;
    margin: 0 0 0.4em;
    color: var(--fg);
    overflow-wrap: break-word;
    word-break: break-word;
    hyphens: auto;
  }

  p{ margin: 0 0 1em; color: var(--fg-dim); }
  ul{ margin: 0; padding: 0; list-style: none; }
  img{ max-width: 100%; display: block; }
  a{ color: inherit; }

  .container{
    width: 100%;
    max-width: var(--container);
    margin: 0 auto;
    padding: 0 32px;
  }

  .eyebrow{
    font-family: var(--font-body);
    text-transform: uppercase;
    letter-spacing: 0.2em;
    font-size: 0.72rem;
    font-weight: 700;
    color: var(--fg-faint);
    margin-bottom: 1.1em;
    display: inline-block;
  }
  .eyebrow::before{
    content: '';
    display: inline-block;
    width: 18px;
    height: 1px;
    background: var(--red);
    margin-right: 10px;
    vertical-align: middle;
  }

  .section{
    padding: 108px 0;
    position: relative;
    background: var(--bg-0);
  }
  .section.alt{ background: var(--bg-1); }

  .section-head{
    max-width: 760px;
    margin: 0 0 64px;
    border-top: 1px solid var(--line);
    padding-top: 28px;
  }
  .section-head h2{ font-size: clamp(2.1rem, 4.6vw, 3.6rem); }
  .section-head p{ font-size: 1.05rem; max-width: 62ch; }

  .btn{
    display: inline-flex;
    align-items: center;
    gap: 0.55em;
    font-family: var(--font-body);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    font-size: 0.8rem;
    font-weight: 700;
    cursor: pointer;
    text-decoration: none;
    border: 1px solid transparent;
    transition: color var(--transition), background var(--transition), border-color var(--transition);
  }
  .btn-primary{
    background: var(--fg);
    color: var(--bg-0);
    border-color: var(--fg);
    padding: 1em 1.9em;
  }
  .btn-primary:hover, .btn-primary:focus-visible{
    background: var(--red);
    border-color: var(--red);
    color: var(--fg);
  }
  .btn-outline{
    background: transparent;
    color: var(--fg);
    padding-bottom: 5px;
    border-bottom: 1px solid var(--fg);
  }
  .btn-outline:hover, .btn-outline:focus-visible{
    color: var(--red);
    border-color: var(--red);
  }
  .btn-outline .arrow{ transition: transform var(--transition); }
  .btn-outline:hover .arrow{ transform: translate(2px, -2px); }

  :focus-visible{
    outline: 2px solid var(--red);
    outline-offset: 3px;
  }

  .skip-link{
    position: absolute;
    left: -999px;
    top: 0;
    background: var(--fg);
    color: var(--bg-0);
    padding: 12px 20px;
    font-family: var(--font-body);
    font-weight: 700;
    z-index: 999;
  }
  .skip-link:focus{ left: 0; }

  /* ---------- Header: fixiert, dunkel/transparent, Cursiv-Logo links,
     schlichte Text-Navigation rechts, Hamburger ganz rechts ---------- */
  .site-header{
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 500;
    height: var(--header-h);
    display: flex;
    align-items: center;
    background-color: rgba(10,10,10,0.72);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--line-soft);
  }
  .header-inner{
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    max-width: var(--container);
    margin: 0 auto;
    padding: 0 32px;
  }
  .brand-link{
    display: flex;
    align-items: baseline;
    gap: 12px;
    text-decoration: none;
    color: var(--fg);
  }
  .brand-script{
    font-family: var(--font-script);
    font-size: 2rem;
    line-height: 1;
    color: var(--fg);
  }
  .brand-tagline{
    font-family: var(--font-body);
    text-transform: uppercase;
    letter-spacing: 0.16em;
    font-size: 0.6rem;
    font-weight: 600;
    color: var(--fg-faint);
    display: none;
  }
  @media (min-width: 560px){ .brand-tagline{ display: inline; } }

  .main-nav ul{
    display: flex;
    gap: 34px;
  }
  .main-nav a{
    position: relative;
    display: inline-block;
    font-family: var(--font-body);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    font-size: 0.8rem;
    font-weight: 600;
    text-decoration: none;
    color: var(--fg-dim);
    padding: 6px 0;
    transition: color var(--transition);
  }
  .main-nav a::after{
    content: '';
    position: absolute;
    left: 0; bottom: 0;
    width: 100%;
    height: 1px;
    background: var(--red);
    transform: scaleX(0);
    transform-origin: left;
    transition: transform var(--transition);
  }
  .main-nav a:hover, .main-nav a:focus-visible{ color: var(--fg); }
  .main-nav a:hover::after, .main-nav a:focus-visible::after{ transform: scaleX(1); }
  .main-nav a[aria-current="page"]{ color: var(--fg); }
  .main-nav a[aria-current="page"]::after{ transform: scaleX(1); }

  .nav-toggle{
    display: none;
    width: 40px;
    height: 40px;
    border: none;
    background: transparent;
    cursor: pointer;
    position: relative;
    margin-left: 20px;
  }
  .nav-toggle span, .nav-toggle span::before, .nav-toggle span::after{
    content: '';
    position: absolute;
    left: 8px;
    right: 8px;
    height: 1px;
    background: var(--fg);
    transition: transform var(--transition), opacity var(--transition), top var(--transition);
  }
  .nav-toggle span{ top: 19px; }
  .nav-toggle span::before{ top: -7px; }
  .nav-toggle span::after{ top: 7px; }
  .nav-toggle[aria-expanded="true"] span{ background: transparent; }
  .nav-toggle[aria-expanded="true"] span::before{ top: 0; transform: rotate(45deg); background: var(--red); }
  .nav-toggle[aria-expanded="true"] span::after{ top: 0; transform: rotate(-45deg); background: var(--red); }

  @media (max-width: 860px){
    .main-nav{
      position: fixed;
      top: 0;
      right: 0;
      height: 100vh;
      width: min(340px, 84vw);
      background: var(--bg-1);
      border-left: 1px solid var(--line);
      transform: translateX(100%);
      transition: transform 360ms ease;
      padding: 120px 32px 32px;
      z-index: 400;
    }
    .main-nav.is-open{ transform: translateX(0); }
    .main-nav ul{ flex-direction: column; gap: 6px; }
    .main-nav a{ display: block; padding: 14px 0; font-size: 1rem; border-bottom: 1px solid var(--line-soft); }
    .main-nav a::after{ display: none; }
    .nav-toggle{ display: block; }
    .nav-scrim{
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      opacity: 0;
      pointer-events: none;
      transition: opacity 360ms ease;
      z-index: 350;
    }
    .nav-scrim.is-open{ opacity: 1; pointer-events: auto; }
  }

  /* ---------- Hero: volle Viewport-Höhe, dunkel, riesige Ghost-
     Typografie im Hintergrund, EIN zentrales hochkant-Foto ---------- */
  .hero{
    position: relative;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    background: var(--bg-0);
    padding: calc(var(--header-h) + 48px) 24px 64px;
    text-align: center;
  }
  .hero-ghost{
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    justify-content: space-evenly;
    z-index: 0;
    pointer-events: none;
  }
  .ghost-row{ overflow: hidden; width: 100%; }
  .ghost-row .ghost-track{
    display: inline-flex;
    width: max-content;
    white-space: nowrap;
    animation: ghost-scroll 80s linear infinite;
    will-change: transform;
  }
  .ghost-row.reverse .ghost-track{ animation-direction: reverse; animation-duration: 100s; }
  .ghost-row span{
    font-family: var(--font-display);
    font-weight: 400;
    text-transform: uppercase;
    font-size: clamp(3.4rem, 9vw, 7.6rem);
    line-height: 1;
    letter-spacing: 0.01em;
    padding-right: 0.5em;
    color: transparent;
    -webkit-text-stroke: 1.5px rgba(243,242,238,0.07);
  }
  @keyframes ghost-scroll{
    from{ transform: translateX(0); }
    to{ transform: translateX(-50%); }
  }

  .hero-content{ position: relative; z-index: 1; max-width: 720px; }
  .hero-photo{
    width: min(380px, 62vw);
    aspect-ratio: 3 / 4;
    margin: 0 auto 32px;
    overflow: hidden;
    border: 1px solid var(--line);
  }
  .hero-photo img{ width: 100%; height: 100%; object-fit: cover; object-position: center 40%; }
  .hero h1{
    font-size: clamp(2rem, 5vw, 3.4rem);
    margin-bottom: 0.4em;
  }
  .hero-claim{
    font-size: 1.08rem;
    max-width: 56ch;
    margin: 0 auto;
  }
  .hero-actions{
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 24px;
    margin-top: 1.8em;
  }

  /* ---------- Scroll reveal ---------- */
  .reveal{
    opacity: 0;
    transform: translateY(30px);
    transition: opacity 750ms ease, transform 750ms ease;
  }
  .reveal.is-visible{
    opacity: 1;
    transform: translateY(0);
  }

  /* ---------- Vollbild-Bildergrid ohne Abstände: dünne Trennlinien
     zwischen den Spalten statt Karten/Boxen ---------- */
  .grid-editorial{
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 1px;
    background: var(--line);
    border-top: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
  }
  .grid-col{ background: var(--bg-0); display: flex; flex-direction: column; }
  .g-photo{ aspect-ratio: 4 / 5; overflow: hidden; }
  .g-photo img{ width: 100%; height: 100%; object-fit: cover; transition: transform 700ms ease; }
  .grid-col:hover .g-photo img{ transform: scale(1.06); }
  .g-body{ padding: 32px 30px 40px; flex: 1; }
  .g-num{
    font-family: var(--font-display);
    font-size: 1rem;
    color: var(--red);
    margin-bottom: 0.6em;
  }
  .g-body h3{ font-size: clamp(1.25rem, 2vw, 1.6rem); margin-bottom: 0.4em; }
  .g-body p{ font-size: 0.95rem; max-width: 40ch; margin-bottom: 0; }

  @media (max-width: 900px){
    .grid-editorial{ grid-template-columns: 1fr; }
  }

  /* ---------- Riesige Lauftext-Zeile (Marquee) als Sektionstrenner ---------- */
  .marquee-big{
    overflow: hidden;
    background: var(--bg-0);
    border-top: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
    padding: 26px 0;
  }
  .marquee-big .marquee-track{
    display: inline-flex;
    align-items: center;
    width: max-content;
    white-space: nowrap;
    animation: marquee-scroll 34s linear infinite;
    will-change: transform;
  }
  .marquee-big span{
    font-family: var(--font-display);
    font-weight: 400;
    text-transform: uppercase;
    font-size: clamp(1.8rem, 5.4vw, 3.6rem);
    line-height: 1;
    color: var(--bg-3);
    padding: 0 0.4em;
  }
  .marquee-big span.sep{ color: var(--red); font-size: clamp(1rem, 2vw, 1.6rem); }
  @keyframes marquee-scroll{
    from{ transform: translateX(0); }
    to{ transform: translateX(-50%); }
  }

  /* ---------- Zweispaltige Text-Grid-Zeilen: dünne Trennlinie, links
     Eyebrow, rechts großer fetter Wert ---------- */
  .stat-rows{ border-bottom: 1px solid var(--line); }
  .stat-row{
    display: grid;
    grid-template-columns: minmax(160px, 300px) 1fr;
    gap: 24px;
    align-items: baseline;
    padding: 26px 0;
    border-top: 1px solid var(--line);
  }
  .stat-row .stat-label{
    font-family: var(--font-body);
    text-transform: uppercase;
    letter-spacing: 0.14em;
    font-size: 0.72rem;
    font-weight: 700;
    color: var(--fg-faint);
  }
  .stat-row .stat-value{
    font-family: var(--font-display);
    font-size: clamp(1.2rem, 2.6vw, 2rem);
    text-transform: uppercase;
    color: var(--fg);
  }
  .stat-row .stat-value small{
    display: block;
    font-family: var(--font-body);
    text-transform: none;
    font-size: 0.95rem;
    color: var(--fg-dim);
    letter-spacing: normal;
    margin-top: 6px;
  }
  @media (max-width: 640px){
    .stat-row{ grid-template-columns: 1fr; gap: 6px; }
  }

  /* ---------- Warum-Liste als nummerierte flache Zeilen ---------- */
  .why-photo{
    aspect-ratio: 16 / 10;
    overflow: hidden;
    margin-bottom: 56px;
    border-top: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
  }
  .why-photo img{ width: 100%; height: 100%; object-fit: cover; }

  /* ---------- Stanley/Stella Markenfoto-Reihe: randlose 2er-Bildreihe,
     gleiches Vollbild-Grid-Prinzip wie .grid-editorial/.gallery-grid,
     als Aufmacher zwischen Einleitung und 3-Punkte-Liste ---------- */
  .stst-photo-row{
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 1px;
    background: var(--line);
    border-top: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
    margin-bottom: 56px;
  }
  .stst-photo{ aspect-ratio: 4 / 3; overflow: hidden; background: var(--bg-0); }
  .stst-photo img{ width: 100%; height: 100%; object-fit: cover; transition: transform 700ms ease; }
  .stst-photo:hover img{ transform: scale(1.06); }
  @media (max-width: 640px){
    .stst-photo-row{ grid-template-columns: 1fr; }
  }

  .warum-intro-grid{
    display: grid;
    grid-template-columns: 1.2fr 1fr;
    gap: 56px;
    align-items: center;
    margin-bottom: 56px;
  }
  .warum-photo{
    aspect-ratio: 4 / 3;
    overflow: hidden;
    border: 1px solid var(--line);
  }
  .warum-photo img{ width: 100%; height: 100%; object-fit: cover; display: block; }
  @media (max-width: 880px){
    .warum-intro-grid{ grid-template-columns: 1fr; gap: 32px; }
  }

  .why-list{ border-bottom: 1px solid var(--line); }
  .why-list li{
    display: grid;
    grid-template-columns: 72px 1fr;
    gap: 20px;
    padding: 30px 0;
    border-top: 1px solid var(--line);
  }
  .why-list .wl-num{
    font-family: var(--font-display);
    font-size: 1.4rem;
    color: var(--red);
  }
  .why-list h3{ font-size: clamp(1.1rem, 1.8vw, 1.4rem); margin-bottom: 0.3em; }
  .why-list p{ font-size: 0.96rem; margin-bottom: 0; max-width: 62ch; }
  @media (max-width: 600px){
    .why-list li{ grid-template-columns: 1fr; gap: 8px; }
  }

  /* ---------- CTA-Zeile: großer Text links, quadratischer Pfeil-
     Rahmen rechts, ganze Zeile klickbar ---------- */
  .cta-row{
    display: block;
    text-decoration: none;
    color: var(--fg);
    border-top: 1px solid var(--line);
  }
  .cta-row-inner{
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 24px;
    padding: 44px 0;
    transition: padding var(--transition);
  }
  .cta-row-text{
    font-family: var(--font-display);
    text-transform: uppercase;
    font-size: clamp(1.6rem, 4.4vw, 3.1rem);
    line-height: 1;
    transition: color var(--transition);
  }
  .cta-arrow{
    flex: none;
    width: 64px;
    height: 64px;
    border: 1px solid var(--fg);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.5rem;
    transition: background var(--transition), border-color var(--transition), color var(--transition), transform var(--transition);
  }
  .cta-row:hover .cta-row-text, .cta-row:focus-visible .cta-row-text{ color: var(--red); }
  .cta-row:hover .cta-arrow, .cta-row:focus-visible .cta-arrow{
    background: var(--red);
    border-color: var(--red);
    color: var(--fg);
    transform: rotate(45deg);
  }

  /* ---------- Galerie: Vollbild-Grid ohne Abstände ---------- */
  .gallery-grid{
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-auto-rows: 220px;
    gap: 1px;
    background: var(--line);
    border-top: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
  }
  .gallery-item{
    position: relative;
    grid-column: span 1;
    grid-row: span 1;
    overflow: hidden;
    padding: 0;
    cursor: pointer;
    background: var(--bg-0);
    border: none;
  }
  .gallery-item.large{ grid-column: span 2; grid-row: span 2; }
  .gallery-item img{
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: transform 600ms ease;
  }
  .gallery-item:hover img, .gallery-item:focus-visible img{ transform: scale(1.08); }
  .gallery-item .cap{
    position: absolute;
    left: 0; right: 0; bottom: 0;
    padding: 14px 16px;
    font-family: var(--font-body);
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    font-weight: 600;
    color: var(--fg);
    background: linear-gradient(0deg, rgba(0,0,0,0.85), transparent);
    text-align: left;
    opacity: 0;
    transition: opacity var(--transition);
  }
  .gallery-item:hover .cap, .gallery-item:focus-visible .cap{ opacity: 1; }

  @media (max-width: 760px){
    .gallery-grid{ grid-template-columns: repeat(2, 1fr); grid-auto-rows: 200px; }
    .gallery-item.large{ grid-column: span 2; grid-row: span 1; }
  }

  /* ---------- Lightbox ---------- */
  .lightbox{
    position: fixed;
    inset: 0;
    background: rgba(6,6,6,0.96);
    color: var(--fg);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 900;
    padding: 32px;
  }
  .lightbox.is-open{ display: flex; }
  .lightbox figure{
    max-width: min(92vw, 1100px);
    max-height: 90vh;
    margin: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
  }
  .lightbox img{
    max-width: 100%;
    max-height: 78vh;
    border: 1px solid var(--line);
  }
  .lightbox figcaption{
    font-family: var(--font-body);
    color: var(--fg-dim);
    font-size: 0.88rem;
    text-align: center;
  }
  .lightbox-close{
    position: absolute;
    top: 24px;
    right: 28px;
    width: 46px;
    height: 46px;
    background: transparent;
    border: 1px solid var(--line);
    color: var(--fg);
    font-size: 1.4rem;
    line-height: 1;
    cursor: pointer;
    transition: border-color var(--transition), color var(--transition);
  }
  .lightbox-close:hover, .lightbox-close:focus-visible{ border-color: var(--red); color: var(--red); }

  /* ---------- Kontakt ---------- */
  .kontakt-grid{
    display: grid;
    grid-template-columns: 0.85fr 1.15fr;
    gap: 64px;
  }
  @media (max-width: 880px){ .kontakt-grid{ grid-template-columns: 1fr; gap: 48px; } }

  .kontakt-address{ margin-top: 32px; border-top: 1px solid var(--line); }
  .kontakt-address .addr-row{
    display: grid;
    grid-template-columns: minmax(100px,160px) 1fr;
    gap: 16px;
    padding: 16px 0;
    border-bottom: 1px solid var(--line);
  }
  .kontakt-address dt{ font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.12em; font-weight: 700; color: var(--fg-faint); margin: 0; }
